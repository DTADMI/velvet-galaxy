# Auto-generated by scripts/scaffold-gitlab-ci.mjs - NF standard pipeline
stages:
  - validate
  - deploy

variables:
  PNPM_VERSION: "11.5.0"
  NODE_VERSION: "26.3.0"
  NODE_OPTIONS: "--max-old-space-size=4096"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "preview"
    - if: $CI_PIPELINE_SOURCE == "web"

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store

.node_base: &node_base
  image: node:${NODE_VERSION}
  before_script:
    # Node 25+ removed corepack from its distribution; install pnpm via npm.
    - npm install -g pnpm@${PNPM_VERSION}
    - pnpm config set store-dir .pnpm-store
    # pnpm 11 blocks native build scripts (sharp/esbuild/...) unless allowBuilds is set.
    # Approve the common native deps so `--frozen-lockfile` does not fail with
    # ERR_PNPM_IGNORED_BUILDS. Projects that already declare allowBuilds are untouched.
    - |
      if [ ! -f pnpm-workspace.yaml ]; then
        printf 'packages:\n  - .\n' > pnpm-workspace.yaml
      fi
      if ! grep -q '^allowBuilds:' pnpm-workspace.yaml; then
        printf '\nallowBuilds:\n  sharp: true\n  esbuild: true\n  unrs-resolver: true\n  core-js: true\n  supabase: true\n  protobufjs: true\n' >> pnpm-workspace.yaml
      fi

validate:
  <<: *node_base
  stage: validate
  script:
    - pnpm install --frozen-lockfile
    - pnpm typecheck
    - pnpm lint
    - pnpm test

# Vercel deploy - GATED on validate, PRECOMPILED (Vercel does not build).
# The heavy build runs locally via pre-commit (NF-GATE-001), NOT in CI.
# `vercel build` here is the minimal Vercel-specific step required to produce
# the prebuilt output that `vercel deploy --prebuilt` ships.
deploy:vercel:
  <<: *node_base
  stage: deploy
  needs: [validate]
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "web"
  script:
    - pnpm install --frozen-lockfile
    - npm i -g vercel@54.14.5
    - vercel pull --yes --environment=production --token=$VERCEL_TOKEN
    - vercel build --prod --token=$VERCEL_TOKEN
    - vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN

