# Auto-generated by scripts/scaffold-gitlab-ci.mjs — NF standard pipeline
stages:
  - validate
  - build

variables:
  PNPM_VERSION: "11.5.0"
  NODE_VERSION: "26.3.0"

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "preview"
    - if: $CI_PIPELINE_SOURCE == "web"

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store

.node_base: &node_base
  image: node:${NODE_VERSION}
  before_script:
    # Node 25+ removed corepack from its distribution; install pnpm via npm.
    - npm install -g pnpm@${PNPM_VERSION}
    - pnpm config set store-dir .pnpm-store

validate:
  <<: *node_base
  stage: validate
  script:
    - pnpm install --frozen-lockfile
    - pnpm typecheck
    - pnpm lint
    - pnpm test

build:
  <<: *node_base
  stage: build
  script:
    - pnpm install --frozen-lockfile
    - pnpm build

